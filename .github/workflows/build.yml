name: Build Arson Client

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.2.1'

      - name: Build
        run: gradle build --no-daemon --stacktrace

      - name: Verify JAR
        shell: bash
        run: |
          shopt -s nullglob
          jars=(build/libs/*.jar)
          if [ ${#jars[@]} -eq 0 ]; then
            echo "No JAR was produced in build/libs"
            exit 1
          fi
          printf 'Built JAR: %s\n' "${jars[@]}"

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: arson-client-${{ github.sha }}
          path: build/libs/*.jar
          if-no-files-found: error
          retention-days: 30
